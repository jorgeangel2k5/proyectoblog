<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .bg-login-image {
            background-image: url('https://www.carniceriademadrid.es/wp-content/uploads/2022/09/smash-burger-que-es.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .full-height {
            min-height: 100vh;
        }

        body {
            background: #fcb044;
            background: linear-gradient(90deg,
                    rgba(252, 176, 68, 1) 42%,
                    rgba(255, 241, 115, 1) 100%);

        }
    </style>
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row full-height align-items-center">


            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center py-5">
                <div class="w-100 px-4" style="max-width: 450px;">

                    <h2 class="fw-bold mb-4 text-center text-md-start">Bienvenido</h2>


                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label">Usuario o Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="connected" class="form-check-input" id="connected" />
                            <label for="connected" class="form-check-label">Mantenerme Conectado</label>
                        </div>




                        <div class="mb-3 text-end">
                            <a href="#" class="text-decoration-none small" data-bs-toggle="modal"
                                data-bs-target="#recoverModal">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-4">Ingresar</button>
                    </form>


                    <div class="d-flex align-items-center my-3">
                        <hr class="flex-grow-1 text-muted">
                        <span class="mx-2 text-muted small">O ingresa con</span>
                        <hr class="flex-grow-1 text-muted">
                    </div>


                    <div class="d-grid gap-2">
                        <a href="#"
                            class="btn btn-outline-danger d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-google"></i> Continuar con Google
                        </a>
                        <a href="#"
                            class="btn btn-outline-primary d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-facebook"></i> Continuar con Facebook
                        </a>
                    </div>

                </div>
            </div>


            <div class="col-md-6 d-none d-md-block bg-login-image px-0">
            </div>

        </div>
    </div>

    <div class="modal fade" id="recoverModal" tabindex="-1" aria-labelledby="recoverModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-md">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">


                <div class="bg-primary text-white p-4 text-center">
                    <div class="mb-3">
                        <i class="fa-solid fa-lock fs-1"></i>
                    </div>

                    <h4 class="fw-bold mb-1" id="recoverModalLabel">
                        ¿Olvidaste tu contraseña?
                    </h4>

                    <p class="mb-0 small opacity-75">
                        Recupera el acceso a tu cuenta en pocos pasos
                    </p>
                </div>


                <div class="modal-body p-4">

                    <div class="alert alert-light border d-flex align-items-start gap-3 rounded-3">
                        <i class="fa-solid fa-envelope text-primary fs-5 mt-1"></i>

                        <div class="small text-muted">
                            Ingresa el correo asociado a tu cuenta y te enviaremos
                            un enlace seguro para restablecer tu contraseña.
                        </div>
                    </div>

                    <form>

                        <div class="mb-4">
                            <label for="recoverEmail" class="form-label fw-semibold">
                                Correo Electrónico
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="fa-solid fa-at text-muted"></i>
                                </span>

                                <input type="email" class="form-control py-2" id="recoverEmail"
                                    placeholder="tu-correo@ejemplo.com" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
                            <i class="fa-solid fa-paper-plane me-2"></i>
                            Enviar enlace de recuperación
                        </button>

                    </form>

                </div>


                <div class="modal-footer border-0 justify-content-center pb-4">

                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">

                        Cerrar
                    </button>

                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
